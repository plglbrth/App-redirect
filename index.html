<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get the Hypnosis Downloads App</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

  :root {
    --hd-red:      #c4302c;
    --hd-white:    #ffffff;
    --hd-grey:     #989487;
    --hd-dark:     #221e1f;
    --hd-light-bg: #f5f4f2;
    --hd-orange:   #f8981d;
    --hd-green:    #70b445;
    --hd-blue:     #219fda;
    --font: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--hd-light-bg);
    color: var(--hd-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .card {
    max-width: 420px;
    width: 100%;
  }

  .logo {
    width: 180px;
    max-width: 60%;
    height: auto;
    margin: 0 auto 28px;
    display: block;
  }

  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 20px;
    border: 3px solid #e3e0da;
    border-top-color: var(--hd-orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-family: var(--font);
    font-weight: 700;
    font-size: 20px;
    color: var(--hd-dark);
    margin: 0 0 8px;
  }

  p {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--hd-grey);
    margin: 0 0 24px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.btn {
    display: block;
    padding: 14px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-family: var(--font);
    font-weight: 600;
    font-size: 15px;
  }

  a.btn-primary {
    background: var(--hd-orange);
    color: var(--hd-white);
  }
  a.btn-primary:hover { background: #e08010; }

  a.btn-secondary {
    background: var(--hd-green);
    color: var(--hd-white);
  }
  a.btn-secondary:hover { background: #5a9438; }

  a.btn-outline {
    background: transparent;
    color: var(--hd-dark);
    border: 1px solid var(--hd-grey);
  }

  noscript p {
    color: var(--hd-red);
  }
</style>
</head>

      var IOS_URL = "http://itunes.apple.com/gb/app/hypnosis-downloads/id658735310?pt=2126412&ct=HD%20App%20page&mt=8";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.uncommonknowledge.hypnosisapp";
      var FALLBACK_URL = "https://www.hypnosisdownloads.com/user/reg/first-time";

      // Pass through any query string (e.g. UTM params) onto the fallback destination,
      // so the source of a scan (e.g. utm_source=im_email) is preserved wherever we land.
      function appendQuery(url, search) {
        if (!search) return url;
        var joiner = url.indexOf("?") === -1 ? "?" : "&";
        return url + joiner + search.replace(/^\?/, "");
      }

      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var search = window.location.search;

      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      // iPadOS 13+ reports as "MacIntosh" with touch support — catch that case too.
      var isIPadOS13 = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      var isAndroid = /Android/.test(ua);

      var destination = null;

      if (isIOS || isIPadOS13) {
        destination = IOS_URL; // App Store links aren't good candidates for UTM passthrough
      } else if (isAndroid) {
        destination = ANDROID_URL;
      } else {
        destination = appendQuery(FALLBACK_URL, search);
      }

      // Update the primary button in case JS redirect is blocked/delayed but the page still renders.
      document.getElementById("primary-link").href = destination;

      window.location.replace(destination);
    })();
  </script>
</body>
